# EXAMPLE ONLY. Do not apply this file: it holds placeholders, and applying it
# would replace a real Secret with them. Do not put real values in it either.
#
# Create the real Secret from two local files that are not in the repository
# (the file names become the file names under /run/secrets in the sidecar):
#
#   kubectl create secret generic maxmind-credentials \
#     --from-file=account_id=./account_id \
#     --from-file=license_key=./license_key
#
# This file only shows the shape: name maxmind-credentials, keys account_id
# and license_key, as the manifest expects.
apiVersion: v1
kind: Secret
metadata:
  name: maxmind-credentials
type: Opaque
stringData:
  account_id: REPLACE_WITH_MAXMIND_ACCOUNT_ID
  license_key: REPLACE_WITH_MAXMIND_LICENSE_KEY
